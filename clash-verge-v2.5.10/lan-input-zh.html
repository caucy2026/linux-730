<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>回填订阅链接</title>
    <style>
      :root { color-scheme: light dark; font-family: sans-serif; }
      body { margin: 0; padding: 24px; }
      main { max-width: 32rem; margin: 0 auto; }
      label { display: block; margin: 16px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; }
      button { margin-top: 16px; padding: 10px 16px; font-size: 16px; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>回填订阅链接</h1>
      <p>输入电脑上显示的校验码，再粘贴订阅链接。电脑上的订阅输入框会自动回填。</p>
      <form id="lan-form">
        <label for="pair-code">校验码</label>
        <input id="pair-code" name="code" autocomplete="off" required />
        <label for="profile-url">订阅链接</label>
        <input id="profile-url" name="url" type="url" inputmode="url" placeholder="https://" required />
        <button type="submit">发送到电脑</button>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const codeInput = document.getElementById('pair-code')
      const urlInput = document.getElementById('profile-url')
      const status = document.getElementById('status')
      if (params.get('code')) codeInput.value = params.get('code')
      document.getElementById('lan-form').addEventListener('submit', async (event) => {
        event.preventDefault()
        status.textContent = '正在发送…'
        try {
          const response = await fetch('/submit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ code: codeInput.value.trim(), url: urlInput.value.trim() }),
          })
          const body = await response.json()
          status.textContent = body.ok ? '已发送，可以回到电脑。' : '校验码或链接未被接受。'
        } catch (error) {
          status.textContent = '无法连接到电脑。'
        }
      })
    </script>
  </body>
</html>
