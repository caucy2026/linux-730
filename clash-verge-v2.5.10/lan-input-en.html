<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backfill profile URL</title>
    <style>
      :root { color-scheme: light dark; font-family: sans-serif; }
      body { margin: 0; padding: 24px; }
      main { max-width: 32rem; margin: 0 auto; }
      label { display: block; margin: 16px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; }
      button { margin-top: 16px; padding: 10px 16px; font-size: 16px; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Backfill profile URL</h1>
      <p>Enter the pairing code shown on the desktop, then paste the subscription link. The desktop profile field fills in automatically.</p>
      <form id="lan-form">
        <label for="pair-code">Pairing code</label>
        <input id="pair-code" name="code" autocomplete="off" required />
        <label for="profile-url">Subscription URL</label>
        <input id="profile-url" name="url" type="url" inputmode="url" placeholder="https://" required />
        <button type="submit">Send to desktop</button>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const codeInput = document.getElementById('pair-code')
      const urlInput = document.getElementById('profile-url')
      const status = document.getElementById('status')
      if (params.get('code')) codeInput.value = params.get('code')
      document.getElementById('lan-form').addEventListener('submit', async (event) => {
        event.preventDefault()
        status.textContent = 'Sending…'
        try {
          const response = await fetch('/submit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ code: codeInput.value.trim(), url: urlInput.value.trim() }),
          })
          const body = await response.json()
          status.textContent = body.ok ? 'Sent. You can return to the desktop.' : 'The code or URL was not accepted.'
        } catch (error) {
          status.textContent = 'Could not reach the desktop.'
        }
      })
    </script>
  </body>
</html>
