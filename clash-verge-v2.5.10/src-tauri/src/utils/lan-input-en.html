<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter subscription address</title><style>body{font:16px system-ui,sans-serif;margin:0;padding:24px;background:#f5f7fa;color:#172334}main{max-width:480px;margin:24px auto;padding:24px;background:white;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border-radius:8px;margin:12px 0}input{border:1px solid #b6c2d1}button{border:0;background:#2467dc;color:white}p{line-height:1.6;color:#556579}</style><main><h1>Enter subscription address</h1><p>Use the same LAN as your computer. Review the address on the desktop before importing.</p><form method="post"><label for="address">Subscription address</label><input id="address" name="address" type="url" inputmode="url" maxlength="4096" required autofocus autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://"><button>Send to desktop</button></form></main></html>
